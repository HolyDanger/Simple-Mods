name: Release
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/release.yml'
      - '.github/release-notes/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  notes:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Update published release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for notes in .github/release-notes/v*.md; do
            tag="$(basename "$notes" .md)"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --notes-file "$notes"
            fi
          done
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check release notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $notes = Join-Path '.github/release-notes' ($env:RELEASE_TAG + '.md')
          if (-not (Test-Path -LiteralPath $notes)) { throw 'Write version-specific release notes before publishing a tag.' }
          if ([string]::IsNullOrWhiteSpace((Get-Content -LiteralPath $notes -Raw))) { throw 'Release notes cannot be empty.' }
      - name: Build and validate
        shell: pwsh
        run: |
          ./Build.ps1
          ./build/Release/LocalizationTest.exe
          if ($LASTEXITCODE -ne 0) { throw 'Localization test failed.' }
          ./build/Release/ModContractTest.exe (Resolve-Path './build/Release/ExampleMod.dll').Path
          if ($LASTEXITCODE -ne 0) { throw 'ABI test failed.' }
      - name: Package and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $archive = ./Package.ps1 -Tag $env:RELEASE_TAG
          $notes = Join-Path '.github/release-notes' ($env:RELEASE_TAG + '.md')
          gh release create $env:RELEASE_TAG $archive --verify-tag --title "Simple Mods $env:RELEASE_TAG" --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
